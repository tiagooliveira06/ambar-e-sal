function presHTML(){return`<div class="card"><h3>Regras do modelo (mês a mês, de MES_INICIO a dezembro)</h3><ul><li><b>Cenário base</b>: Fbase(m) = fat. do mês m no ano base × (1+g); g = crescimento homólogo acumulado (só meses reais). Meta mensal = ano base × (1+meta).</li><li><b>Sazonalidade</b>: S(m) = fat. mês m ÷ média mensal (jan-jun se ref. C06; anual caso contrário); pode ser desligada.</li><li><b>P1</b>: Fp1(m) = PROD_REF × S(m) × RAMPA_k × (1−CANIB), k = m−h+1 (máx. 10). Custo = CUSTO_MENSAL + COMISSÃO×Fp1; no mês h + custos de entrada. CUSTO_MENSAL = SAL×N_PAG/12×(1+TSU+SEG) + SUB×DIAS/12 + viatura + ajudas + comunicações.</li><li><b>P2</b>: CPL efetivo = CPL×(1+REND_DECR×log2(B/ORC)) se B&gt;ORC. Novos clientes = B/CPL efetivo × CONV. Compram a partir de t+desfasamento: COMPRA_NOVO nos 6 primeiros meses e ×RETENÇÃO depois. Sem fator S (a regra do prompt só o prevê em P1).</li><li><b>P3</b>: FbaseK = Fbase × peso das categorias no mês (ano base). Fat. promo = FbaseK×(1−d)×(1+ELAST×d). Antecipação no mês seguinte: −FbaseK×ANTECIP (se janeiro seguinte: indicador «efeito no ano seguinte»). Custo mercadorias = FbaseK×(1+ELAST×d)×(1−margem). Desconto = FbaseK×(1+ELAST×d)×d. Custo fixo por promoção. Aviso em novembro se d+25% &gt; máximo.</li><li><b>Margem incremental</b>: P1/P2 = fat. × margem ponderada; P3 = variação de (fat. − custo mercadorias). <b>Resultado</b> = margem − custos − TRANSP×fat. <b>ROI</b> = resultado ÷ (custos + desconto). <b>Custo/€ adicional</b> = (custos + desconto) ÷ fat. incremental.</li><li><b>Valor a 24 meses</b>: resultado de P1 e P2 em 24 meses a contar da entrada/campanha. <b>Combinação</b>: soma das alavancas (pressuposto de aditividade).</li><li><b>Resultado operacional</b> = fat. base × margem ponderada − gastos base (pessoal, 12×custos fixos, viaturas comerciais ×12, transportes, comissões atuais, marketing corrente) + resultado incremental.</li></ul></div><div class="card"><h3>Origem dos parâmetros</h3><div id="orig"></div></d function ld(){return new Promise((ok,ko)=>{if(window.XLSX)return ok();const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=()=>ko('Não foi possível carregar a biblioteca SheetJS (o ambiente pode bloquear scripts externos). Use «Importar configuração».');document.head.appendChild(s)})}
const MAP={SAL:'FV_SAL_BASE',COM:'FV_COMISSAO',VIA:'FV_VIATURA',AJU:'FV_AJUDAS',CMU:'FV_COMUNIC',REC:'FV_RECRUT',FOR:'FV_FORMACAO',EQP:'FV_EQUIP',CAN:'FV_CANIB',NPAG:'N_PAG',TSU:'TSU_EP',SEG:'SEG_AT',SUB:'SUB_ALIM_DIA',DIAS:'DIAS_UTEIS_ANO',CN:'MKT_COMPRA_NOVO',RET:'MKT_RETENCAO_6M',DEC:'MKT_REND_DECR',EL:'PRM_ELAST',ANT:'PRM_ANTECIP',CFX:'PRM_CUSTO_FIXO',DMAX:'PRM_DESC_MAX',REN:'CF_RENDAS',ENE:'CF_ENERGIA',COMUN:'CF_COMUNIC',SEG2:'CF_SEGUROS',OUT:'CF_OUTROS',FROTA:'CF_FROTA_LOG',TR:'TRANSP_PCT',PMR:'PMR',PC06:'FV_PROD_C06',PEXP:'FV_PROD_EXPERIENTE'},TOP={nome:'EMP_NOME',setor:'EMP_SETOR',sede:'EMP_SEDE',equipa:'EMP_EQUIPA',ab:'ANO_BASE',am:'ANO_META',meta:'META_CRESC',mi:'MES_INICIO'};
async function impX(f){const msg=$('msg');try{await ld();const wb=XLSX.read(await f.arrayBuffer()),sh=n=>{if(!wb.Sheets[n])throw'Falta a folha '+n;return wb.Sheets[n]},rw=n=>XLSX.utils.sheet_to_json(sh(n),{header:1}),ob=n=>XLSX.utils.sheet_to_json(sh(n));
const N=clone(S),c={};rw('Configuracao').forEach(r=>{if(typeof r[0]=='string')c[r[0]]=r});
for(const k in TOP)if(c[TOP[k]]&&c[TOP[k]][2]!=null&&c[TOP[k]][2]!=='[preencher]')N[k]=c[TOP[k]][2];for(const k in MAP)if(typeof(c[MAP[k]]||[])[2]=='number')N.P[k]=c[MAP[k]][2];
const rhs=Object.keys(c).filter(k=>/^RH_/.test(k)&&k!='RH_TOTAL');if(rhs.length)N.rh=rhs.map(k=>({d:c[k][1],n:c[k][2],s:c[k][3],auto:k=='RH_FV'}));
N.ramp=N.ramp.map((_,i)=>c['FV_RAMPA_'+(i+1)]?c['FV_RAMPA_'+(i+1)][2]:N.ramp[i]);const mk=Object.keys(c).filter(k=>/^MKT_/.test(k)&&typeof c[k][6]=='number');if(mk.length)N.canais=mk.map(k=>({n:c[k][1],cpl:c[k][6],conv:c[k][7],orc:c[k][9],desf:c[k][10]}));
const pr=c.FV_PROD_REF?c.FV_PROD_REF[2]:N.P.PC06;N.P.REF=Math.abs(pr-N.P.PC06)<1?'c06':'man';N.P.PMAN=pr;
const E=ob('Encomendas'),h={};E.forEach(r=>{const a=r['Ano'],m=r['Mês'];(h[a]=h[a]||Z())[m-1]+=r['Valor líquido (€, sem IVA)']||0});
if(!h[N.ab]||!h[N.am])throw'Faltam dados de '+N.ab+' ou '+N.am;let n=0;h[N.am].forEach((v,i)=>{if(v>0)n=i+1});N.hist={base:h[N.ab].map(v=>+v.toFixed(2)),meta:h[N.am].slice(0,n).map(v=>+v.toFixed(2))};N.manual=false;
const cat={},cmm={};ob('Linhas_Encomenda').forEach(r=>{if(r['Ano']!=N.ab)return;const k=r['Categoria'];cat[k]=cat[k]||[0,0];cat[k][0]+=r['Valor líquido (€, sem IVA)'];cat[k][1]+=r['Custo total (€)'];(cmm[k]=cmm[k]||Z())[r['Mês']-1]+=r['Valor líquido (€, sem IVA)']});
const ks=Object.keys(cat),tot=sum(ks.map(k=>cat[k][0])),mt=Z();ks.forEach(k=>cmm[k].forEach((v,i)=>mt[i]+=v));N.cats=ks.map(k=>({n:k,m:+(1-cat[k][1]/cat[k][0]).toFixed(4),w:+(cat[k][0]/tot).toFixed(5)}));N.share=ks.map(k=>cmm[k].map((v,i)=>mt[i]?v/mt[i]:0));
const cv=ob('Comerciais');if(cv.length)N.com=cv.map(r=>{const kf=Object.keys(r),km=kf.find(k=>k.startsWith('Faturação média mensal')),ka=kf.find(k=>k=='Faturação '+N.ab+' (€)'),md=r[km]||0;return{c:r['Código'],sal:r['Salário base mensal (€)'],com:r['Comissão sobre vendas (%)'],via:r['Viatura e combustível (€/mês)'],fat:+md.toFixed(2),m:md?Math.round(r[ka]/md):12}});
const cx=ob('Campanhas_Marketing'),yr={};cx.forEach(r=>{const y=2000+parseInt(String(r['Código campanha']).slice(3,5));yr[y]=(yr[y]||0)+r['Investimento (€)']});const ys=Object.keys(yr).filter(y=>y<N.am);if(ys.length)N.P.MKTC=sum(ys.map(y=>yr[y]))/ys.length;
const ex=N.com.filter(x=>/^C0[1-5]$/.test(x.c));if(ex.length)N.P.PEXP=sum(ex.map(x=>x.fat))/ex.length;
S=N;S.mi=Math.max(S.mi,S.hist.meta.length+1);C=newC(S.mi);renderAll();$('msg').innerHTML='<div class="w">Excel importado: '+E.length+' encomendas, '+ks.length+' categorias, ano base '+S.ab+', meta '+S.am+'.</div>'}catch(e){msg.innerHTML='<div class="w">'+(e.message||e)+'</div>'}}

set(p,v);if(t.dataset.r)return renderAll();refresh()});

renderAll()});
