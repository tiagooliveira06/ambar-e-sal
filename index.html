iv>`}

function optHTML(){const ck=(p,l)=>`<label style="flex-direction:row;gap:6px;align-items:center"><input type="checkbox" style="width:auto;min-width:0" data-p="${p}" ${get(p)?'checked':''}> ${l}</label>`;
return`<div class="card"><h3>Otimizador com orçamento</h3><p><small>Procura a combinação de medidas (P1, P2 e P3) que melhor cumpre o objetivo sem ultrapassar o orçamento. <b>Investimento</b> = custos incrementais no ano + desconto concedido. Só são aceites combinações sem avisos do modelo. Usa pesquisa aleatória seguida de melhoria local: encontra uma boa solução, não garante a ótima.</small></p>
<div class="g">${fl('Orçamento máximo (€)','U.oB',{min:0})}<label>Objetivo<select data-p="U.oO">${Object.keys(OBJ).map(k=>`<option value="${k}" ${U.oO==k?'selected':''}>${OBJ[k][0]}</option>`).join('')}</select></label><label>Combinações a testar<select data-p="U.oN" data-n=1>${[1000,3000,6000].map(n=>`<option value=${n} ${U.oN==n?'selected':''}>${n}</option>`).join('')}</select></label></div>
<div class="g" style="margin:6px 0">${ck('U.oP1','Pode usar P1 (força de vendas)')}${ck('U.oP2','Pode usar P2 (marketing)')}${ck('U.oP3','Pode usar P3 (promoções)')}</div>
<button class="b" data-x="optrun">▶ Procurar a melhor combinação</button><div id="optres"></div></div>`}
async function optRun(){if(OPTBUSY)return;OPTBUSY=1;try{const B=Math.max(0,+U.oB||0),N=+U.oN||3000,f=OBJ[U.oO]||OBJ.res,S2=clone(S),mi=Math.max(S.mi,S.hist.meta.length+1),ms=[];for(let m=mi;m<=12;m++)ms.push(m);
const al={p1:!!U.oP1,p2:!!U.oP2,p3:!!U.oP3},rnd=n=>Math.floor(Math.random()*n),pick=a=>a[rnd(a.length)],ds=[.05,.1,.15,.2,.25,.3,.4,.5].filter(d=>d<=S.P.DMAX+1e-9),nc=S.canais.length,nk=S.cats.length;
const ev=c=>{const r=calc(S2,c),inv=r.I.cost+r.I.ds;return{c,r,inv,sc:(inv<=B+1e-6&&!r.warn.length)?f[1](r):-Infinity}};
const rand=()=>{const c=newC(mi);if(al.p1&&Math.random()<.5)c.p1[0]={n:1+rnd(6),h:pick(ms)};
if(al.p2)c.p2.forEach((_,i)=>{if(Math.random()<.45){const j=rnd(nc);c.p2[i]={c:j,B:Math.round(S.canais[j].orc*pick([.25,.5,.75,1,1.5,2])),t:pick(ms)}}});
if(al.p3&&ds.length&&Math.random()<.45){const K=Math.random()<.3?S.cats.map((_,i)=>i):S.cats.map((_,i)=>i).filter(()=>Math.random()<.4);if(K.length)c.p3[0]={d:pick(ds),K,m:pick(ms),len:1+rnd(3)}}return c};
const mut=c0=>{const c=clone(c0),w=[];if(al.p1)w.push(1);if(al.p2)w.push(2);if(al.p3&&ds.length)w.push(3);if(!w.length)return c;const k=pick(w),r=Math.random();
if(k==1){const v=c.p1[0];if(r<.6)v.n=Math.max(0,Math.min(6,v.n+(Math.random()<.5?-1:1)));else v.h=pick(ms)}
if(k==2){const v=c.p2[rnd(3)];if(!(v.B>0)){const j=rnd(nc);Object.assign(v,{c:j,B:Math.round(S.canais[j].orc*.5),t:pick(ms)})}else if(r<.5)v.B=Math.max(0,Math.round(v.B*(.6+Math.random()*.8)));else if(r<.7)v.t=pick(ms);else if(r<.85)v.c=rnd(nc);else v.B=0}
if(k==3){const v=c.p3[rnd(3)];if(!(v.d>0)||!v.K.length)Object.assign(v,{d:pick(ds),K:[rnd(nk)],m:pick(ms),len:1});else if(r<.3){const i=rnd(nk),p=v.K.indexOf(i);if(p<0)v.K.push(i);else v.K.splice(p,1)}else if(r<.5)v.d=pick(ds);else if(r<.7)v.m=pick(ms);else if(r<.85)v.len=Math.max(1,Math.min(6,v.len+(Math.random()<.5?-1:1)));else v.d=0}return c};
const pool=[ev(newC(mi)),ev(clone(C))],prog=(i)=>{const e=$('optres');if(e)e.innerHTML=`<div class="w">A testar combinações… ${i} de ${N}</div>`};
// "Estratégia" = que alavancas, canais, n.º de comerciais e desconto usa (ignora montantes e meses), para sugerir alternativas diferentes
const sig=c=>[c.p1.filter(v=>v.n>0).map(v=>'P1x'+v.n).join(),[...new Set(c.p2.filter(v=>v.B>0).map(v=>v.c))].sort().join(),c.p3.filter(v=>v.d>0&&v.K.length).map(v=>v.d+'/'+v.K.length).sort().join()].join('|');
const top=(byS)=>{const m=new Map();pool.filter(x=>x.sc>-Infinity).sort((a,b)=>b.sc-a.sc).forEach(x=>{const k=byS?sig(x.c):descC(x.c);if(!m.has(k))m.set(k,x)});return[...m.values()]};
const n1=Math.round(N*.4);for(let i=0;i<n1;i++){pool.push(ev(rand()));if(i%300==299){prog(i+1);await tick()}}
const seeds=top().slice(0,5),per=Math.round((N-n1)/Math.max(1,seeds.length));let cnt=n1;
for(const s0 of seeds){let cur=s0;for(let j=0;j<per;j++){const nx=ev(mut(cur.c));if(nx.sc>=cur.sc){cur=nx;pool.push(nx)}if(++cnt%300==0){prog(cnt);await tick()}}}
OPT={B,obj:U.oO in OBJ?U.oO:'res',N,sols:top(1).slice(0,5).map(x=>({C:x.c,inv:x.inv,r:x.r,sc:x.sc,d:descC(x.c)})),t:new Date()}}finally{OPTBUSY=0}optRender()}
function optRows(btn){return OPT.sols.map((s,i)=>{const I=s.r.I,q=quality(s.r);const dd=escH(s.d).split(' · ').join('<br>'),row=[i+1,btn?`<div style="white-space:normal;text-align:left;min-width:260px">${dd}<div style="margin-top:4px"><button class="b" data-x="optap${i}">Aplicar</button><button class="b s" data-x="optsv${i}">Guardar como cenário</button></div></div>`:dd,eur(s.inv),eur(I.inc),pc(I.pm),eur(I.res),num(I.roi),eur(I.v24),Math.round(q.score)+' — '+q.label];
return row})}
const OPTH=['#','Medidas','Investimento','Fat. incremental','% da meta','Resultado incremental','ROI','Valor a 24 meses','Qualidade'];
function optRender(){const el=$('optres');if(!el)return;if(!OPT){el.innerHTML='<p><small>Defina o orçamento e o objetivo e carregue em «Procurar».</small></p>';return}
const best=OPT.sols[0];el.innerHTML=`<p><small>${OPT.N} combinações testadas às ${OPT.t.toLocaleTimeString('pt-PT')} — orçamento ${eur(OPT.B)}, objetivo: ${OBJ[OPT.obj][0].toLowerCase()}.</small></p>`+
(best&&best.d=='Não aplicar medidas'?'<div class="w">Com este orçamento e objetivo, nenhuma combinação testada é melhor do que não aplicar medidas.</div>':'')+
tbl(OPTH,optRows(true)).replace('<table>','<table class="tl2">')+'<small>As 5 melhores combinações distintas encontradas. «Aplicar» substitui as medidas atuais (pode anular com Ctrl+Z).</small>'}
